name: decompilation progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate objdiff v2 report
        run: python3 tools/generate_decomp_report.py
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: N8ME_report
          path: build/report.json
          if-no-files-found: error
      - name: Publish progress to decmp.dev
        uses: decmp/upload-action@v1
        with:
          report: build/report.json
          version: N8ME
          name: Madden Football 64
          short-name: Madden 64
          platform: n64
          default-version: N8ME
