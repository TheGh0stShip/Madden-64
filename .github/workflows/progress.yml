name: decompilation progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate objdiff v2 report
        run: python3 tools/generate_decomp_report.py
      - name: Upload progress report
        uses: actions/upload-artifact@v6
        with:
          name: N8ME_report
          path: build/report.json
          if-no-files-found: error
      - name: Publish progress to decmp.dev
        run: |
          curl -fsSL https://api.decmp.dev/action/v1.1.0.mjs -o decmp.mjs
          echo "10fb0039a067b4ffe67510959356a691efa6efbb0aae16450c04f8c64da0a5f8  decmp.mjs" | sha256sum -c
          node decmp.mjs
        env:
          DECMP_REPORT: build/report.json
          DECMP_VERSION: N8ME
          DECMP_NAME: Madden Football 64
          DECMP_SHORT_NAME: Madden 64
          DECMP_PLATFORM: n64
          DECMP_DEFAULT_VERSION: N8ME
